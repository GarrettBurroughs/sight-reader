# Every push to main: run all tests, build one image, deploy it to staging.
# deploy/promote.sh later sends that exact image to prod (promote.yml).
name: Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation: no stored GCP keys

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web tests and build
        working-directory: web
        run: npm ci && npm test && npm run build
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Server tests
        run: pip install -r server/requirements-dev.txt && python -m pytest server/tests -q
      - name: Pipeline tests
        working-directory: pipeline
        run: python -m unittest discover -s tests

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Fetch the library named in library.version
        run: |
          source deploy/config.sh
          mkdir -p build/library
          gcloud storage cat "gs://$LIBRARY_BUCKET/$(cat library.version).tar.gz" | tar -xz -C build/library
      - name: Build and push the image
        id: image
        run: |
          source deploy/config.sh
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          version="${GITHUB_SHA::7}+$(cat library.version)"
          docker build --build-arg "VERSION=$version" -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"
          echo "ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Deploy to staging
        run: deploy/deploy.sh staging "${{ steps.image.outputs.ref }}" "${{ steps.image.outputs.version }}"
