# Send the image currently running on staging to prod: same digest, no rebuild.
# Start it with deploy/promote.sh (or "Run workflow" on GitHub).
name: Promote to prod

on:
  workflow_dispatch:

concurrency:
  group: prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read what staging is running
        id: staging
        run: |
          source deploy/config.sh
          svc=$(service_name staging)
          image=$(gcloud run services describe "$svc" --region "$REGION" --format 'value(spec.template.spec.containers[0].image)')
          version=$(gcloud run services describe "$svc" --region "$REGION" --format json \
            | jq -r '.spec.template.spec.containers[0].env[] | select(.name=="SIGHTREADER_VERSION") | .value')
          echo "Staging runs $version ($image)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Deploy to prod
        run: deploy/deploy.sh prod "${{ steps.staging.outputs.image }}" "${{ steps.staging.outputs.version }}"
