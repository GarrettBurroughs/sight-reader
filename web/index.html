<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sight Reader</title>
  </head>
  <body>
    <header>
      <h1>Sight Reader</h1>
      <div id="status">Loading…</div>
    </header>

    <div class="toolbar">
      <span class="mode">Wait mode</span>
      <span id="progress">—</span>
      <span>Next: <strong id="expect">—</strong></span>
      <span>Wrong notes: <strong id="mistakes">0</strong></span>
      <span>Time: <strong id="time">0:00</strong></span>
      <button id="restart" type="button">Restart</button>
    </div>

    <div id="done" hidden></div>

    <main>
      <div id="score"></div>
      <div id="piano"></div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
